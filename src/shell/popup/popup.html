<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Application Tracker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        padding: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 6px;
      }
      #status {
        font-size: 12px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h3>AI Provider</h3>
    <label for="provider">Provider</label>
    <select id="provider"></select>
    <label for="apiKey">API key for this provider (stored locally only)</label>
    <input id="apiKey" type="password" placeholder="paste key..." />
    <button id="save">Save</button>
    <div id="status"></div>
    <hr />
    <h3>Ghosted flag</h3>
    <label for="ghostedThreshold">Flag as "possibly ghosted" after this many days of no reply</label>
    <input id="ghostedThreshold" type="number" min="1" step="1" />
    <button id="saveGhostedThreshold">Save</button>
    <div id="ghostedThresholdStatus"></div>
    <hr />
    <button id="openDashboard">Open Dashboard</button>
    <script src="./popup.js"></script>
  </body>
</html>
