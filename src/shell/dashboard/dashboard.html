<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Application Tracker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .application {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 12px;
      }
      .company {
        font-weight: 600;
      }
      .summary {
        color: #444;
        margin-top: 4px;
      }
      .meta {
        font-size: 12px;
        color: #888;
        margin-top: 6px;
      }
      a {
        color: inherit;
      }
      #empty {
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>Job Applications</h1>
    <div id="list"></div>
    <p id="empty" hidden>No applications tracked yet. Open a job-related email in Gmail and click the tracker button.</p>
    <script src="./dashboard.js"></script>
  </body>
</html>
