<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Application Tracker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .application {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 12px;
      }
      .company {
        font-weight: 600;
      }
      .stage {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: #1a73e8;
        background: #e8f0fe;
        border-radius: 4px;
        padding: 2px 6px;
        margin-top: 4px;
      }
      .joining-link {
        margin-top: 4px;
        font-size: 12px;
      }
      .summary {
        color: #444;
        margin-top: 4px;
      }
      .meta {
        font-size: 12px;
        color: #888;
        margin-top: 6px;
      }
      a {
        color: inherit;
      }
      #empty {
        color: #888;
      }
      #sessionBar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid #ddd;
      }
      #sessionStatus {
        font-size: 13px;
        color: #444;
        margin-right: auto;
      }
      .session-row {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }
      .reassign-session {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Job Applications</h1>
    <div id="sessionBar">
      <div id="sessionStatus"></div>
      <select id="sessionScope"></select>
      <button id="startSession">Start New Hunt</button>
      <button id="endSession" hidden>End Current Hunt</button>
    </div>
    <div id="list"></div>
    <p id="empty" hidden>No applications tracked yet. Open a job-related email in Gmail and click the tracker button.</p>
    <script src="./dashboard.js"></script>
  </body>
</html>
