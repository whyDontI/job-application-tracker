<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Application Tracker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 1400px;
        margin: 40px auto;
        padding: 0 16px;
      }
      #board {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        overflow-x: auto;
      }
      .column {
        flex: 0 0 240px;
        background: #f7f7f8;
        border-radius: 8px;
        padding: 8px;
      }
      .column-header {
        font-weight: 600;
        font-size: 13px;
        color: #444;
        padding: 4px 6px 8px;
      }
      .column-cards {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .application {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        background: #fff;
      }
      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .company {
        font-weight: 600;
      }
      .edit-application {
        font-size: 11px;
        color: #444;
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 1px 6px;
        cursor: pointer;
      }
      .stage {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        color: #1a73e8;
        background: #e8f0fe;
        border-radius: 4px;
        padding: 2px 6px;
        margin-top: 4px;
      }
      .joining-link {
        margin-top: 4px;
        font-size: 12px;
      }
      .ghosted-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: #b45309;
        background: #fef3c7;
        border-radius: 4px;
        padding: 2px 6px;
        margin-top: 4px;
        margin-left: 4px;
      }
      .ghosted-badge button {
        font-size: 11px;
        font-weight: 600;
        color: #b45309;
        background: #fff;
        border: 1px solid #b45309;
        border-radius: 4px;
        padding: 1px 6px;
        cursor: pointer;
      }
      .summary {
        color: #444;
        margin-top: 4px;
      }
      .meta {
        font-size: 12px;
        color: #888;
        margin-top: 6px;
      }
      a {
        color: inherit;
      }
      #empty {
        color: #888;
      }
      #sessionBar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid #ddd;
      }
      #sessionStatus {
        font-size: 13px;
        color: #444;
        margin-right: auto;
      }
      .session-row {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }
      .reassign-session {
        font-size: 12px;
      }
      #viewToggle {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
      }
      #viewToggle button.active {
        font-weight: 600;
        background: #e8f0fe;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid #eee;
      }
      th.sortable {
        cursor: pointer;
        user-select: none;
      }
      th.sortable:hover {
        color: #1a73e8;
      }
    </style>
  </head>
  <body>
    <h1>Job Applications</h1>
    <div id="sessionBar">
      <div id="sessionStatus"></div>
      <select id="sessionScope"></select>
      <button id="startSession">Start New Hunt</button>
      <button id="endSession" hidden>End Current Hunt</button>
    </div>
    <div id="viewToggle">
      <button id="showBoard" class="active">Board</button>
      <button id="showTable">Table</button>
      <button id="addApplication" style="margin-left: auto">+ Add Application</button>
    </div>
    <div id="board"></div>
    <table id="table" hidden>
      <thead>
        <tr>
          <th class="sortable" data-sort-key="company">Company</th>
          <th class="sortable" data-sort-key="stage">Stage</th>
          <th>Round</th>
          <th>Joining Link</th>
          <th>Last Follow-up</th>
          <th class="sortable" data-sort-key="daysSinceFollowUp">Days Since Follow-up</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p id="empty" hidden>No applications tracked yet. Open a job-related email in Gmail and click the tracker button.</p>
    <script src="./dashboard.js"></script>
  </body>
</html>
